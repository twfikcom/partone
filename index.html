<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Story of AI & Divine Wisdom</title>
    
    <!-- Fonts: Amiri (Arabic), Cinzel (Titles), Cormorant Garamond (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper-bg: #fdf6e3;
            --ink-color: #2c241b;
            --accent-color: #8b4513;
            --shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #2b2b2b;
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            font-family: 'Cormorant Garamond', serif;
            color: var(--ink-color);
            overflow-x: hidden;
            transition: all 0.5s ease;
        }

        /* Paper Scroll Container */
        .ancient-scroll {
            max-width: 800px;
            margin: 40px auto;
            background-color: var(--paper-bg);
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            padding: 60px 40px;
            box-shadow: 
                inset 0 0 80px rgba(139, 69, 19, 0.1),
                0 0 20px rgba(0,0,0,0.5);
            border-radius: 5px;
            position: relative;
            border: 1px solid #d4c5a9;
            min-height: 80vh;
        }

        /* Scroll Edges Effect */
        .ancient-scroll::before, .ancient-scroll::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(to bottom, rgba(139,69,19,0.2), transparent);
            pointer-events: none;
        }
        .ancient-scroll::before { top: 0; }
        .ancient-scroll::after { bottom: 0; transform: rotate(180deg); }

        /* Language Switcher */
        .lang-switch {
            display: block;
            margin: 0 auto 30px auto;
            background: transparent;
            padding: 8px 12px;
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            color: var(--ink-color);
            font-size: 0.9rem;
            text-align: center;
            width: fit-content;
        }
        
        .lang-switch:hover {
            background: rgba(139, 69, 19, 0.1);
        }

        .lang-switch:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(139, 69, 19, 0.2);
        }

        /* Typography */
        h1, h2 {
            font-family: 'Cinzel', serif;
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        p {
            font-size: 1.3rem;
            line-height: 1.8;
            margin-bottom: 25px;
            text-align: justify;
        }

        .bismillah {
            text-align: center;
            font-family: 'Amiri', serif;
            font-size: 1.5rem;
            margin-bottom: 40px;
            color: var(--ink-color);
        }

        .divider {
            text-align: center;
            margin: 40px 0;
            font-size: 2rem;
            color: var(--accent-color);
            opacity: 0.6;
        }

        /* RTL Specifics */
        body.rtl {
            direction: rtl;
        }
        body.rtl h1, body.rtl h2 {
            font-family: 'Amiri', serif;
        }
        body.rtl p {
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
        }
        
        /* Animations */
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease;
        }
        
        .visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .ancient-scroll {
                margin: 0;
                width: 100%;
                box-sizing: border-box;
                padding: 30px 20px;
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div class="ancient-scroll">
        <select id="languageSelector" class="lang-switch" aria-label="Select Language">
            <option value="en">English</option>
            <option value="ar">العربية</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
        </select>

        <div class="bismillah animate-on-scroll">﷽</div>
        
        <h1 id="title" class="animate-on-scroll"></h1>
        
        <p id="intro" class="animate-on-scroll"></p>

        <div class="divider animate-on-scroll">✦</div>

        <h2 id="subtitle1" class="animate-on-scroll"></h2>
        <p id="part1" class="animate-on-scroll"></p>

        <div class="divider animate-on-scroll">✦</div>

        <h2 id="subtitle2" class="animate-on-scroll"></h2>
        <p id="part2" class="animate-on-scroll"></p>
        <p id="part3" class="animate-on-scroll"></p>

        <div class="divider animate-on-scroll">✦</div>

        <h2 id="subtitle3" class="animate-on-scroll"></h2>
        <p id="conclusion" class="animate-on-scroll"></p>
        
        <p id="footer" class="animate-on-scroll" style="text-align: center; font-size: 0.9rem; margin-top: 50px; opacity: 0.7; font-style: italic;">
        </p>
    </div>
</body>
</html>
