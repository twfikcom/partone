<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Story of AI & Divine Wisdom</title>
    
    <!-- Fonts: Amiri (Arabic), Cinzel (Titles), Cormorant Garamond (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Link External CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@0.1.0"
  }
}
</script>
</head>
<body>
    <!-- Mystery Loading Screen -->
    <div id="loading-screen">
        <div class="loader-symbol">✦</div>
        <div class="loader-text">Seeking Knowledge...</div>
    </div>

    <div class="ancient-scroll">
        <select id="languageSelector" class="lang-switch" aria-label="Select Language">
            <option value="en">English</option>
            <option value="ar">العربية</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
        </select>

        <div class="bismillah animate-on-scroll">﷽</div>
        
        <!-- CHAPTER 1 -->
        <div id="chapter-1" class="chapter fade-in-active">
            <h1 id="title" class="animate-on-scroll"></h1>
            
            <p id="intro" class="animate-on-scroll"></p>

            <div class="divider animate-on-scroll">✦</div>

            <h2 id="subtitle1" class="animate-on-scroll"></h2>
            <p id="part1" class="animate-on-scroll"></p>

            <div class="divider animate-on-scroll">✦</div>

            <h2 id="subtitle2" class="animate-on-scroll"></h2>
            <p id="part2" class="animate-on-scroll"></p>
            <p id="part3" class="animate-on-scroll"></p>

            <div class="divider animate-on-scroll">✦</div>

            <h2 id="subtitle3" class="animate-on-scroll"></h2>
            <p id="conclusion" class="animate-on-scroll"></p>
            
            <div class="nav-container animate-on-scroll">
                <button id="btn-to-c2" class="nav-btn">
                    <i class="fa-solid fa-scroll"></i> <span>Open Chapter 2</span>
                </button>
            </div>

            <p id="footer" class="animate-on-scroll" style="text-align: center; font-size: 0.9rem; margin-top: 30px; opacity: 0.7; font-style: italic;">
            </p>
        </div>

        <!-- CHAPTER 2 -->
        <div id="chapter-2" class="chapter" style="display: none;">
            <h1 id="c2-title" class="animate-on-scroll"></h1>
            
            <p id="c2-intro" class="animate-on-scroll"></p>

            <div class="divider animate-on-scroll">✦</div>

            <h2 id="c2-subtitle1" class="animate-on-scroll"></h2>
            <p id="c2-part1" class="animate-on-scroll"></p>

            <div class="divider animate-on-scroll">✦</div>

            <h2 id="c2-subtitle2" class="animate-on-scroll"></h2>
            <p id="c2-part2" class="animate-on-scroll"></p>

            <div class="nav-container animate-on-scroll">
                <button id="btn-c2-to-c1" class="nav-btn">
                    <i class="fa-solid fa-arrow-left"></i> <span>Return to Chapter 1</span>
                </button>
                <button id="btn-to-c3" class="nav-btn" style="margin-left: 10px;">
                    <i class="fa-solid fa-scroll"></i> <span>Open Chapter 3</span>
                </button>
            </div>

            <p id="c2-footer" class="animate-on-scroll" style="text-align: center; font-size: 0.9rem; margin-top: 30px; opacity: 0.7; font-style: italic;">
            </p>
        </div>

        <!-- CHAPTER 3 -->
        <div id="chapter-3" class="chapter" style="display: none;">
            <h1 id="c3-title" class="animate-on-scroll"></h1>
            
            <p id="c3-intro" class="animate-on-scroll"></p>

            <div class="divider animate-on-scroll">✦</div>

            <h2 id="c3-subtitle1" class="animate-on-scroll"></h2>
            <p id="c3-part1" class="animate-on-scroll"></p>

            <div class="divider animate-on-scroll">✦</div>

            <h2 id="c3-subtitle2" class="animate-on-scroll"></h2>
            <p id="c3-part2" class="animate-on-scroll"></p>

            <div class="divider animate-on-scroll">✦</div>
            
            <h2 id="c3-subtitle3" class="animate-on-scroll"></h2>
            <p id="c3-part3" class="animate-on-scroll"></p>

            <div class="nav-container animate-on-scroll">
                <button id="btn-c3-to-c2" class="nav-btn">
                    <i class="fa-solid fa-arrow-left"></i> <span>Return to Chapter 2</span>
                </button>
                <button id="btn-to-c4" class="nav-btn" style="margin-left: 10px;">
                    <i class="fa-solid fa-scroll"></i> <span>Open Chapter 4</span>
                </button>
            </div>

            <p id="c3-footer" class="animate-on-scroll" style="text-align: center; font-size: 0.9rem; margin-top: 30px; opacity: 0.7; font-style: italic;">
            </p>
        </div>

        <!-- CHAPTER 4 -->
        <div id="chapter-4" class="chapter" style="display: none;">
            <h1 id="c4-title" class="animate-on-scroll"></h1>
            
            <p id="c4-intro" class="animate-on-scroll"></p>

            <div class="divider animate-on-scroll">✦</div>

            <h2 id="c4-subtitle1" class="animate-on-scroll"></h2>
            <p id="c4-part1" class="animate-on-scroll"></p>

            <div class="divider animate-on-scroll">✦</div>

            <h2 id="c4-subtitle2" class="animate-on-scroll"></h2>
            <p id="c4-part2" class="animate-on-scroll"></p>

            <div class="nav-container animate-on-scroll">
                <button id="btn-c4-to-c3" class="nav-btn">
                    <i class="fa-solid fa-arrow-left"></i> <span>Return to Chapter 3</span>
                </button>
            </div>

            <p id="c4-footer" class="animate-on-scroll" style="text-align: center; font-size: 0.9rem; margin-top: 30px; opacity: 0.7; font-style: italic;">
            </p>
        </div>

    </div>

    <!-- Main Logic Script -->
    <script type="module" src="index.js"></script>
</body>
</html>
