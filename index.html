<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Story of AI & Divine Wisdom</title>
    
    <!-- Fonts: Amiri (Arabic), Cinzel (Titles), Cormorant Garamond (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --paper-bg: #fdf6e3;
            --ink-color: #2c241b;
            --accent-color: #8b4513;
            --shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #2b2b2b;
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            font-family: 'Cormorant Garamond', serif;
            color: var(--ink-color);
            overflow-x: hidden;
            transition: all 0.5s ease;
        }

        /* Paper Scroll Container */
        .ancient-scroll {
            max-width: 800px;
            margin: 40px auto;
            background-color: var(--paper-bg);
            background-image: url('https://www.transparenttextures.com/patterns/cream-paper.png');
            padding: 60px 40px;
            box-shadow: 
                inset 0 0 80px rgba(139, 69, 19, 0.1),
                0 0 20px rgba(0,0,0,0.5);
            border-radius: 5px;
            position: relative;
            border: 1px solid #d4c5a9;
        }

        /* Scroll Edges Effect */
        .ancient-scroll::before, .ancient-scroll::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(to bottom, rgba(139,69,19,0.2), transparent);
            pointer-events: none;
        }
        .ancient-scroll::before { top: 0; }
        .ancient-scroll::after { bottom: 0; transform: rotate(180deg); }

        /* Language Switcher */
        .lang-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: var(--paper-bg);
            padding: 10px;
            border: 1px solid var(--accent-color);
            border-radius: 4px;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            color: var(--ink-color);
        }

        /* Typography */
        h1, h2 {
            font-family: 'Cinzel', serif;
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
        }

        p {
            font-size: 1.3rem;
            line-height: 1.8;
            margin-bottom: 25px;
            text-align: justify;
        }

        .bismillah {
            text-align: center;
            font-family: 'Amiri', serif;
            font-size: 1.5rem;
            margin-bottom: 40px;
            color: var(--ink-color);
        }

        .divider {
            text-align: center;
            margin: 40px 0;
            font-size: 2rem;
            color: var(--accent-color);
            opacity: 0.6;
        }

        /* RTL Specifics */
        body.rtl {
            direction: rtl;
        }
        body.rtl h1, body.rtl h2 {
            font-family: 'Amiri', serif;
        }
        body.rtl p {
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
        }
        
        /* Animations */
        .animate-on-scroll {
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease;
        }
        
        .visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .ancient-scroll {
                margin: 0;
                width: 100%;
                box-sizing: border-box;
                padding: 30px 20px;
            }
        }
    </style>
